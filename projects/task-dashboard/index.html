<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SprintFlow - Modern Task Management and Project Productivity Dashboard built by Abhay Singh." />
  <title>SprintFlow | Task Management &amp; Productivity Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --card-hover: #172138;
      --border: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --purple: #a855f7;
      --accent: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1240px; margin: 0 auto; padding: 1.5rem; }

    /* Top Header */
    .top-bar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .brand-wrap { display: flex; align-items: center; gap: 1rem; }
    .back-btn { font-size: 0.82rem; color: var(--muted); padding: 0.35rem 0.75rem; background: #131b2e; border: 1px solid var(--border); border-radius: 6px; }
    .back-btn:hover { color: var(--primary); border-color: var(--primary); }
    .brand-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
    .brand-title span { color: var(--primary); }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; font-size: 0.88rem; cursor: pointer; border: none; transition: 0.2s; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

    /* Metrics Grid */
    .metrics-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 2.25rem; }
    .metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; }
    .metric-label { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-value { font-size: 1.8rem; font-weight: 800; margin: 0.35rem 0; color: var(--text); }
    .progress-bar-bg { width: 100%; height: 6px; background: #1e293b; border-radius: 999px; overflow: hidden; margin-top: auto; }
    .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.4s ease; }

    /* Kanban Board */
    .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .kanban-col { background: rgba(17, 24, 39, 0.6); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; display: flex; flex-direction: column; min-height: 520px; }
    .col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    .col-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .col-count { background: #1f293d; color: var(--muted); font-size: 0.75rem; font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 999px; }

    .tasks-list { display: flex; flex-direction: column; gap: 1rem; flex: 1; }
    .task-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.15rem; transition: all 0.2s ease; cursor: grab; position: relative; }
    .task-card:hover { border-color: rgba(56, 189, 248, 0.4); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

    .task-tags { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.65rem; }
    .tag-category { font-size: 0.72rem; font-weight: 700; color: var(--primary); background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 0.2rem 0.5rem; border-radius: 4px; }
    .tag-priority { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; }
    .priority-high { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .priority-med { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .priority-low { background: rgba(16, 185, 129, 0.15); color: #10b981; }

    .task-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text); }
    .task-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin-bottom: 0.85rem; }
    
    .task-footer { display: flex; align-items: center; justify-content: space-between; pt: 0.6rem; border-top: 1px solid #1e293b; padding-top: 0.6rem; font-size: 0.78rem; color: var(--muted); }
    .task-actions { display: flex; gap: 0.35rem; }
    .action-btn { background: #1e293b; border: 1px solid var(--border); color: var(--muted); padding: 0.25rem 0.55rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { color: var(--text); border-color: var(--primary); }
    .action-btn.delete:hover { border-color: var(--danger); color: var(--danger); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1.5rem; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #0f1629; border: 1px solid var(--border); border-radius: 14px; max-width: 480px; width: 100%; padding: 2rem; position: relative; }
    .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
    .form-group input, .form-group textarea, .form-group select { background: #151d33; border: 1px solid var(--border); padding: 0.7rem 0.9rem; border-radius: 8px; color: white; font-size: 0.88rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }

    @media (max-width: 900px) {
      .kanban-board { grid-template-columns: 1fr; }
      .kanban-col { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="top-bar">
      <div class="brand-wrap">
        <a href="../../index.html#projects" class="back-btn">← Portfolio</a>
        <div class="brand-title">Sprint<span>Flow</span></div>
      </div>

      <div class="header-actions">
        <button class="btn btn-primary" onclick="openModal()">+ Add New Task</button>
      </div>
    </header>

    <!-- Metrics Row -->
    <section class="metrics-bar">
      <div class="metric-card">
        <span class="metric-label">Total Sprint Tasks</span>
        <div class="metric-value" id="m-total">6</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 100%;"></div></div>
      </div>

      <div class="metric-card">
        <span class="metric-label">Tasks In Progress</span>
        <div class="metric-value" style="color: var(--warning);" id="m-prog">2</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 33%; background: var(--warning);"></div></div>
      </div>

      <div class="metric-card">
        <span class="metric-label">Completed Velocity</span>
        <div class="metric-value" style="color: var(--success);" id="m-comp">2</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="m-comp-bar" style="width: 33%; background: var(--success);"></div></div>
      </div>

      <div class="metric-card">
        <span class="metric-label">Sprint Health</span>
        <div class="metric-value" style="color: var(--primary);" id="m-pct">67%</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="m-pct-bar" style="width: 67%;"></div></div>
      </div>
    </section>

    <!-- Kanban Board -->
    <section class="kanban-board">
      <!-- To Do Column -->
      <div class="kanban-col">
        <div class="col-header">
          <div class="col-title">📋 Backlog / To Do</div>
          <span class="col-count" id="count-todo">2</span>
        </div>
        <div class="tasks-list" id="col-todo">
          <!-- Rendered via JS -->
        </div>
      </div>

      <!-- In Progress Column -->
      <div class="kanban-col">
        <div class="col-header">
          <div class="col-title">⚡ Active Sprint / In Progress</div>
          <span class="col-count" id="count-prog">2</span>
        </div>
        <div class="tasks-list" id="col-prog">
          <!-- Rendered via JS -->
        </div>
      </div>

      <!-- Completed Column -->
      <div class="kanban-col">
        <div class="col-header">
          <div class="col-title">✅ Done &amp; Deployed</div>
          <span class="col-count" id="count-done">2</span>
        </div>
        <div class="tasks-list" id="col-done">
          <!-- Rendered via JS -->
        </div>
      </div>
    </section>
  </div>

  <!-- Add Task Modal -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
        <h3 style="font-size:1.2rem; font-weight:700;">+ Create Sprint Task</h3>
        <button style="background:none; border:none; color:var(--muted); font-size:1.4rem; cursor:pointer;" onclick="closeModal()">&times;</button>
      </div>

      <form id="task-form" onsubmit="handleCreateTask(event)">
        <div class="form-group">
          <label>Task Title</label>
          <input type="text" id="t-title" placeholder="e.g. Implement JWT Refresh Token rotation" required />
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="t-desc" rows="3" placeholder="Brief technical summary..." required></textarea>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label>Category</label>
            <select id="t-category">
              <option value="Backend">Backend</option>
              <option value="Frontend">Frontend</option>
              <option value="Database">Database</option>
              <option value="DevOps">DevOps</option>
            </select>
          </div>

          <div class="form-group">
            <label>Priority</label>
            <select id="t-priority">
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem; justify-content:center;">Add to Sprint Board</button>
      </form>
    </div>
  </div>

  <script>
    let tasks = [
      {
        id: 1,
        title: "Database Indexing & Query Tuning",
        desc: "Add compound indexes on tripId and expenseDate in MongoDB to optimize balance calculation queries.",
        category: "Database",
        priority: "High",
        status: "todo"
      },
      {
        id: 2,
        title: "Dark/Light Theme LocalStorage Sync",
        desc: "Ensure seamless theme persistence without FOUC (flash of unstyled content) on initial load.",
        category: "Frontend",
        priority: "Medium",
        status: "todo"
      },
      {
        id: 3,
        title: "JWT Stateless Middleware Guard",
        desc: "Build Express bearer token validator with automated 401 error response for expired user sessions.",
        category: "Backend",
        priority: "High",
        status: "prog"
      },
      {
        id: 4,
        title: "Recharts Expense Trend Visualization",
        desc: "Integrate responsive line chart showing cumulative daily trip spending against budget limit.",
        category: "Frontend",
        priority: "Medium",
        status: "prog"
      },
      {
        id: 5,
        title: "Greedy Settlement Min-Cash-Flow Algo",
        desc: "Implemented N-node settlement minimizer reducing circular debts into minimal direct payments.",
        category: "Backend",
        priority: "High",
        status: "done"
      },
      {
        id: 6,
        title: "Mobile Hamburger Navigation Drawer",
        desc: "Smooth accessible mobile drawer navigation with auto-collapse on section selection.",
        category: "Frontend",
        priority: "Low",
        status: "done"
      }
    ];

    function renderTasks() {
      const colTodo = document.getElementById('col-todo');
      const colProg = document.getElementById('col-prog');
      const colDone = document.getElementById('col-done');

      colTodo.innerHTML = '';
      colProg.innerHTML = '';
      colDone.innerHTML = '';

      let todoCount = 0;
      let progCount = 0;
      let doneCount = 0;

      tasks.forEach(t => {
        const priorityClass = t.priority === 'High' ? 'priority-high' : t.priority === 'Medium' ? 'priority-med' : 'priority-low';
        
        let moveBtn = '';
        if (t.status === 'todo') {
          todoCount++;
          moveBtn = `<button class="action-btn" onclick="moveTask(${t.id}, 'prog')">Start →</button>`;
        } else if (t.status === 'prog') {
          progCount++;
          moveBtn = `
            <button class="action-btn" onclick="moveTask(${t.id}, 'todo')">← Back</button>
            <button class="action-btn" onclick="moveTask(${t.id}, 'done')">Done ✓</button>
          `;
        } else {
          doneCount++;
          moveBtn = `<button class="action-btn" onclick="moveTask(${t.id}, 'prog')">Reopen ↩</button>`;
        }

        const card = document.createElement('div');
        card.className = 'task-card';
        card.innerHTML = `
          <div class="task-tags">
            <span class="tag-category">${t.category}</span>
            <span class="tag-priority ${priorityClass}">${t.priority}</span>
          </div>
          <h4 class="task-title">${t.title}</h4>
          <p class="task-desc">${t.desc}</p>
          <div class="task-footer">
            <span>Sprint Goal</span>
            <div class="task-actions">
              ${moveBtn}
              <button class="action-btn delete" onclick="deleteTask(${t.id})">✕</button>
            </div>
          </div>
        `;

        if (t.status === 'todo') colTodo.appendChild(card);
        else if (t.status === 'prog') colProg.appendChild(card);
        else colDone.appendChild(card);
      });

      // Update counters
      document.getElementById('count-todo').textContent = todoCount;
      document.getElementById('count-prog').textContent = progCount;
      document.getElementById('count-done').textContent = doneCount;

      const total = tasks.length;
      document.getElementById('m-total').textContent = total;
      document.getElementById('m-prog').textContent = progCount;
      document.getElementById('m-comp').textContent = doneCount;

      const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      document.getElementById('m-pct').textContent = `${pct}%`;
      document.getElementById('m-pct-bar').style.width = `${pct}%`;
      document.getElementById('m-comp-bar').style.width = `${pct}%`;
    }

    function moveTask(id, newStatus) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.status = newStatus;
        renderTasks();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
    }

    function openModal() {
      document.getElementById('task-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.remove('open');
    }

    function handleCreateTask(e) {
      e.preventDefault();
      const title = document.getElementById('t-title').value.trim();
      const desc = document.getElementById('t-desc').value.trim();
      const category = document.getElementById('t-category').value;
      const priority = document.getElementById('t-priority').value;

      if (!title || !desc) return;

      const newTask = {
        id: Date.now(),
        title,
        desc,
        category,
        priority,
        status: 'todo'
      };

      tasks.unshift(newTask);
      closeModal();
      document.getElementById('task-form').reset();
      renderTasks();
    }

    document.addEventListener('DOMContentLoaded', renderTasks);
  </script>
</body>
</html>
